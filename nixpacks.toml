[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = ["cd Retail-Industry-The-Customer-Experience-Consistency-Challenge-main/backend && pip install -r requirements.txt"]

[phases.build]
cmds = []

[start]
cmd = "cd Retail-Industry-The-Customer-Experience-Consistency-Challenge-main/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
